name: whatsapp_guard
version: "2.3.0"
description: "Hard, code-level enforcement for the WhatsApp channel: blocks slash commands, prompt-injection / wiki-extraction / Telegram-injection attempts, and enforces per-DM and per-group-sender conversation round limits — BEFORE the agent runs, independent of whether the agent loads the whatsapp-conversation-rules skill. Registers pre_gateway_dispatch. v2.3.0 (security hardening): fail-closed on internal errors, import failures, and a broken config file (blocks + owner alert instead of silently passing messages through unfiltered); diacritics/zero-width-character-normalized pattern detection; per-conversation file locking shared with the watchdog cron closes a gateway/watchdog race condition; group listen-only mode no longer advances the round counter. v1.2.0 (live WhatsApp incident + fix): hand-off message now sends exactly once per limit-exceeded conversation (was repeating on every subsequent message), group round-limit is now per-sender via a composite state key (was one shared counter for the whole group), DM state keys are canonicalized (LID vs phone-JID unified), shortened the slash-command reply text, Telegram-injection deflection no longer names the Telegram channel. v1.1.0 (review): moved from vendored /opt/hermes/plugins to durable HERMES_HOME/plugins (survives hermes-update.sh), added this manifest (was undiscoverable without it — confirmed via `hermes plugins doctor`), real Telegram alerting via `hermes send` (was a no-op stub), single source of truth for the round counter (the skill no longer double-increments), WHATSAPP_GUARD_MODE=block/warn toggle for the fuzzy-pattern categories only (slash commands + round-limit are always hard-blocked)."
author: "marek-commits"
provides_hooks:
  - pre_gateway_dispatch
