name: whatsapp_guard
version: "2.3.3"
description: "Hard, code-level enforcement for the WhatsApp channel: blocks slash commands, prompt-injection / wiki-extraction / Telegram-injection attempts, and enforces per-DM and per-group-sender conversation round limits — BEFORE the agent runs, independent of whether the agent loads the whatsapp-conversation-rules skill. Registers pre_gateway_dispatch. v2.3.3 (contact mix-up fix): fixed a live incident where lookup_person_profile() could attribute an incoming message to the wrong wiki profile. An exact phone/LID match now has unconditional priority over the name-token fallback across ALL profiles — previously phone and name were checked file-by-file in the same pass and the loop stopped at the first match of either kind, so a wrong name match on an earlier-iterated file could shadow a correct phone match on a later one. The name-token fallback itself is now scoped to prefix-matching against the profile's FILENAME only, not the whole note body — previously a short (2-letter) abbreviation token from a WhatsApp push name could accidentally match unrelated substrings inside a different profile's free-text notes. v2.3.2 (fail-closed alert storm fix): root-caused and fixed a false-alarm source in the fail-closed alerting added in v2.3.0 — whatsapp_guard.py's import was failing inside isolated/sandboxed plugin-discovery runs (e.g. `hermes plugins doctor` builds a throwaway copy of the plugin directory that does not include scripts/, so the import there was guaranteed to fail, not transient); a live restart confirmed the real gateway process itself always starts cleanly against the real HERMES_HOME. The plugin now checks whether scripts/ exists on disk before importing: if it doesn't, it fails closed for that process only and stays silent (no false owner alert); if it does exist and the import still fails, it retries briefly (6 attempts, ~1.8s budget) before alerting, with diagnostic detail (attempt count, sys.path, file existence, PID) attached so a real recurrence is a fast diagnosis instead of a multi-hour investigation. v2.3.0 (security hardening): fail-closed on internal errors, import failures, and a broken config file (blocks + owner alert instead of silently passing messages through unfiltered); diacritics/zero-width-character-normalized pattern detection; per-conversation file locking shared with the watchdog cron closes a gateway/watchdog race condition; group listen-only mode no longer advances the round counter. v1.2.0 (live WhatsApp incident + fix): hand-off message now sends exactly once per limit-exceeded conversation (was repeating on every subsequent message), group round-limit is now per-sender via a composite state key (was one shared counter for the whole group), DM state keys are canonicalized (LID vs phone-JID unified), shortened the slash-command reply text, Telegram-injection deflection no longer names the Telegram channel. v1.1.0 (review): moved from vendored /opt/hermes/plugins to durable HERMES_HOME/plugins (survives hermes-update.sh), added this manifest (was undiscoverable without it — confirmed via `hermes plugins doctor`), real Telegram alerting via `hermes send` (was a no-op stub), single source of truth for the round counter (the skill no longer double-increments), WHATSAPP_GUARD_MODE=block/warn toggle for the fuzzy-pattern categories only (slash commands + round-limit are always hard-blocked)."
author: "marek-commits"
provides_hooks:
  - pre_gateway_dispatch
